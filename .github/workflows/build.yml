name: Build

on:
    push:

permissions:
    contents: read

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: gradle

            - name: Build
              run: .\gradlew.bat :loader:shadowJar :clientmod:assemble

            - name: Upload jar
              uses: actions/upload-artifact@v7
              with:
                  path: loader/build/libs/MinecraftChallenges-*.jar
                  archive: false
                  if-no-files-found: error

            - name: Upload client mod
              uses: actions/upload-artifact@v7
              with:
                  path: clientmod/build/libs/MinecraftChallenges-Client-*.jar
                  archive: false
                  if-no-files-found: error
